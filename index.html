    fullText: `主旨：有關貴局函詢長照個案嗣後符合AA06身體照顧困難加計條件之適用方式一案，復如說明，請查照。

說明：
一、復貴局115年7月17日南市衛照字第1150094574號函。
二、長照給付及支付制度設計AA06(身體照顧困難加計)，係為提供服務機構合理成本，以鼓勵承接照顧困難個案。現行機制係由照顧服務管理資訊平臺(下稱照管系統)依照顧管理專員(下稱照專)評估結果判定資格，並須搭配指定服務組合紀錄始得申報。

(一)新增資格(新增管路、傷口或體重達70公斤以上)：應由照專提前複評，並依照顧需求重新調整照顧計畫後始得申報，不得事後追溯申報費用。
(二)喪失資格(移除管路、傷口復原或體重未達70公斤)：經照專或社區整合型服務中心個案管理員訪視確認後，以「計畫異動」方式由照專於系統註記註銷AA06條件，作為長照服務費用支付審核系統(下稱支審系統)檢核依據，免辦理重新複評。
(三)系統增修：本部擬增修照管系統「AA06申報資格符合取消功能」並同步調整支審系統之檢核邏輯，屆時功能上線將另行通知。

    fullText: `一、   有關聘僱外籍家庭看護工「返鄉未歸」期間短期照顧服務給付資格疑義一案，轉知本局相關單位知悉。
二、   考量外籍家庭看護工返鄉未歸具不可預期性且非可歸責於雇主，並已實際形成照顧空窗，雇主於發現外籍家庭看護工返鄉未依約返臺後，尚須向勞動部申請廢止聘僱許可。
三、   外籍家庭看護工出國後至廢止聘僱許可送達日前之照顧空窗期間，得納入外籍看護工家庭短期替代照顧服務補助對象。`

    docNumber: "本府社會局函轉衛生福利部釋示「身心障礙者輔具費用補助辦法」及「長期照顧服務申請及給付辦法」之改善高低差、固定式斜坡道及非固定式斜坡板補助範圍",

    title: "本府社會局函轉衛生福利部釋示「身心障礙者輔具費用補助辦法」及「長期照顧服務申請及給付辦法」之改善高低差、固定式斜坡道及非固定式斜坡板補助範圍",
    summary: "本府社會局函轉衛生福利部釋示「身心障礙者輔具費用補助辦法」及「長期照顧服務申請及給付辦法」之改善高低差、固定式斜坡道及非固定式斜坡板補助範圍",
    status: "有效",
    sourceUrl: "https://www.health.taichung.gov.tw/media/1438267/%E9%99%84%E4%BB%B61-1150624%E4%B8%AD%E5%B8%82%E7%A4%BE%E9%9A%9C%E5%AD%97%E7%AC%AC1150096979%E8%99%9F.pdf",
    citations: [{agency:"臺中市政府衛生局",agencyShort:"台中",date:"2026-07-13",sourceUrl:"https://www.health.taichung.gov.tw/media/1438267/%E9%99%84%E4%BB%B61-1150624%E4%B8%AD%E5%B8%82%E7%A4%BE%E9%9A%9C%E5%AD%97%E7%AC%AC1150096979%E8%99%9F.pdf",docNumber:"本府社會局函轉衛生福利部釋示「身心障礙者輔具費用補助辦法」及「長期照顧服務申請及給付辦法」之改善高低差、固定式斜坡道及非固定式斜坡板補助範圍"}],
    fullText: `一、依據衛生福利部社會及家庭署115年6月22日衛授家字第1151961577號辦理。
二、有關身心障礙者輔具費用補助辦法附表之「項次140至143(居家無障礙修繕-改善高低差)」、「項次155至158(居家無障礙輔具-非固定式斜坡板)」，以及長期照顧服務申請及給付辦法附表四之「FA03至FA05(居家無障礙設施-非固定式斜坡板)」、「FA06(居家無障礙設施-固定式斜坡道)」補助規定，納入部分建物共用空間之適用一節，考量無障礙改善設施之位置銜接公共空間，仍可能涉及公安消防、公有地或私人產權，爰列入補助範圍之審認，須視個案情形評估。
三、由於實務上住宅結構不盡相同，可能因建物原始設計使室內外地面存有高低差，致行動不便者進出困難，倘前揭無障礙改善設施之位置，係自住家銜接至公共空間，考量非固定式斜坡板具可移動性，對公共空間使用影響相對輕微，得於不違反公安消防規定，且確認所涉空間之所有權人或管理權人同意之前提下，依個案情形核准補助長照居家無障礙環境改善項目；惟固定式斜坡道，倘涉及占用公有地、他人私有土地或公共空間，則不宜納入補助範圍。領有身心障礙證明者，得視個案情形，依身心障礙者輔具費用補助辦法第8條第1項規定，協助申請人提出專案補助申請。
四、請依「長期照顧服務申請及給付辦法」規定辦理。`

    citations: [{agency:"臺中市政府衛生局",agencyShort:"台中",date:"2025-05-06",sourceUrl:"https://www.health.taichung.gov.tw/media/1245322/%E4%B8%AD%E8%8F%AF%E6%B0%91%E5%9C%8B114%E5%B9%B44%E6%9C%8821%E6%97%A5%E8%A1%9B%E9%83%A8%E9%A1%A7%E5%AD%97%E7%AC%AC1141961087%E8%99%9F%E6%9C%89%E9%97%9C%E9%95%B7%E6%9C%9F%E7%85%A7%E9%A1%A7%E6%9C%8D%E5%8B%99%E4%BA%BA%E5%93%A1%E6%87%89%E7%99%BB%E9%8C%84%E9%95%B7%E7%85%A7%E6%9C%8D%E5%8B%99%E5%96%AE%E4%BD%8D-%E5%A7%8B%E5%BE%97%E6%8F%90%E4%BE%9B%E5%8F%8A%E7%94%B3%E5%A0%B1-%E5%B7%B7%E5%BC%84%E9%95%B7%E7%85%A7%E7%AB%99%E5%96%98%E6%81%AF%E6%9C%8D%E5%8B%99-%E7%A2%BC%E5%88%A5ga07-%E8%B2%BB%E7%94%A8%E4%B8%80%E6%A1%88.pdf",docNumber:"有關長期照顧服務人員應登錄長照服務單位，始得提供及 申報「巷弄長照站喘息服務（碼別GA07）」費用一案，為 落實法規遵循，自114年6月1日起，於長照2.0服務費用支付審核系統檢核登錄情形，請查照。"}],
    fullText: `一、轉知衛生福利部114年4月21日衛部顧字第1141961087號函。
二、依據長期照顧服務申請及給付辦法第18條第5款及長期照顧特約管理辦法第42條第7款規定，喘息服務應由長期照顧服務人員訓練認證繼續教育及登錄辦法之照顧服務人員提供，否則該部分費用不予支付。另長期照顧服務法第19條規定，長照人員非經登錄於長照機構，不得提供長照服務。又依長期照顧服務人員訓練認證繼續教育及登錄辦法第17條規定，長照服務單位應於人員實際提供服務前，完成登錄程序。
三、該部於113年3月12日衛部顧字第1131960626號函釋，任職於巷弄長照站之照顧服務人員，如巷弄長照站係經直轄市、縣（市）主管機關審核同意，簽訂行政契約為長照特約單位並實際提供喘息服務，其照顧服務員於該巷弄長照站特約期間任職者，亦可認屬實際提供長照服務。另於114年2月25日衛部顧字第1141960330號函，重申長照服務人員登錄之長照服務單位規範。
四、為確保法規落實，該部自114年6月1日起，於長照2.0服務費用支付審核系統執行登錄情形檢核作業。`

    fullText: `一、依據衛生福利部114年1月22日衛部顧字第1141960235號函。
二、本方案之管理機制，縣市政府負責長照機構特約、個案之長照需要評估及派案等照管流程，又本部「照顧服務管理資訊平台」之居家醫師個案管理已設有中心督導總查詢功能（FC-200），供地方政府查詢個案。
三、依前開規定，縣市政府於派案時，應檢視其過往醫師意見書開立情形，其同一個案醫師意見書每年上限為2次，不因其結案再開案有別；又特約單位之個案管理師，對於同一個案服務應掌握其過往服務情形，並請本府加強該方案之派案照管流程並宣導相關規定，避免是類情形發生。`

    fullText: `一、 有關長照需要等級之給付額度(下稱給付額度)及複評照顧計畫之照顧組合(下稱照顧組合)之生效日原則，茲說明如下：
二、 另 依衛生福利部113年3月15日公告之社區式服務類長期照顧服務機構定型化契約範本第3條說明之第3項規定，已明定長照給付對象接受補助之評估結果有異動時，契約雙方應變更契約或其附件，應依該部公告之定型化契約規範，於長照給付對象複評結果異動時應主動更換契約或其附件，並依本函釋規定申報服務費用。
三、 綜上，原本局於111年11月4日長期照顧特約單位第二次聯繫會議布達之社區式服務個案失能等級改變給付額度及照顧組合判定方式，自113年8月26日停止適用，本函釋規定自衛生福利部函文日113年8月27日開始適用。`

    fullText: `一、依據衛生福利部113年4月9日衛部顧字第1131960856號函辦理。

    fullText: `一、為配合衛生福利部社會及家庭署於111年10月20日衛授家字第1110761152號令修正發布「身心障礙者輔具費用補助辦法」，本部業另以111年12月8日衛部顧字第1111962849號函(諒達)周知「長照輔具現制與身障輔具新制對照表」在案，先予敘明。

    citations: [{agency:"臺中市政府衛生局",agencyShort:"台中",date:"2022-12-22",sourceUrl:"https://www.health.taichung.gov.tw/media/889438/1111213-%E8%A1%9B%E9%83%A8%E9%A1%A7%E5%AD%97%E7%AC%AC1111962788%E8%99%9F-%E6%9C%89%E9%97%9C%E6%9C%AA%E5%85%B7%E5%83%B1%E5%82%AD%E9%97%9C%E4%BF%82%E4%B9%8B%E7%85%A7%E9%A1%A7%E6%9C%8D%E5%8B%99%E5%8B%9E%E5%8B%95%E5%90%88%E4%BD%9C%E7%A4%BE%E9%99%84%E8%A8%AD%E9%95%B7%E7%85%A7%E7%89%B9%E7%B4%84%E5%96%AE%E4%BD%8D-%E6%96%BC%E9%95%B7%E6%9C%9F%E7%85%A7%E9%A1%A7%E6%9C%8D%E5%8B%99%E6%B3%95%E7%AC%AC32%E6%A2%9D%E4%B9%8B2%E6%87%89%E5%85%B7%E4%B9%8B%E5%8B%9E%E5%8B%95%E6%AC%8A%E7%9B%8A%E7%AF%84%E7%96%87.pdf",docNumber:"有關未具僱傭關係之照顧服務勞動合作社附設長照特約單位，於長期照顧服務法第32條之2應具之勞動權益範疇。"}],
    fullText: `一、依長期照顧服務法第32條之2第2項，長照特約單位應確保其長照人員之勞動條件符合勞動有關法規，故凡長照特約單位，無論其屬是否具僱傭關係，均應確保其長照人員之勞動條件符合勞動有關法規，先予敘明。
二、照顧服務勞動合作社與社員之僱傭關係認定，應依勞動部「勞動契約認定指導原則」及「勞動契約從屬性判斷檢核表」檢核，以從屬性原則及勞務提供個案事實予以綜合判定。照顧服務勞動合作社與其社員間，倘具僱傭關係，其相關勞動條件應符勞動有關法規；倘未具僱傭關係，其應具之勞動權益範疇，依本函釋示內容辦理。
三、為兼顧勞動合作社之組織特性及長照服務之管理需要與品質維護，衛生福利部111年2月11日會同內政部及勞動部召開之「研商照顧服務勞動合作社附設長照機構符合勞動有關法規第2次會議」，以勞動有關法規之重要且必備面向為原則，將下列面項列為旨揭長照特約單位應具之勞動權益範疇：`

    title: "長照給(支)付價格編列參考基準及相關事宜一案。",
    summary: "長照給(支)付價格編列參考基準及相關事宜一案。",
    status: "有效",
    sourceUrl: "https://www.health.taichung.gov.tw/media/868629/%E9%99%84%E4%BB%B6-1111017-%E8%A1%9B%E9%83%A8%E9%A1%A7%E5%AD%97%E7%AC%AC1111962270%E8%99%9F-%E9%95%B7%E7%85%A7%E7%B5%A6-%E6%94%AF-%E4%BB%98%E5%83%B9%E6%A0%BC%E7%B7%A8%E5%88%97%E5%8F%83%E8%80%83%E6%BA%96%E5%89%87.pdf",
    citations: [{agency:"臺中市政府衛生局",agencyShort:"台中",date:"2022-10-25",sourceUrl:"https://www.health.taichung.gov.tw/media/868629/%E9%99%84%E4%BB%B6-1111017-%E8%A1%9B%E9%83%A8%E9%A1%A7%E5%AD%97%E7%AC%AC1111962270%E8%99%9F-%E9%95%B7%E7%85%A7%E7%B5%A6-%E6%94%AF-%E4%BB%98%E5%83%B9%E6%A0%BC%E7%B7%A8%E5%88%97%E5%8F%83%E8%80%83%E6%BA%96%E5%89%87.pdf",docNumber:"長照給(支)付價格編列參考基準及相關事宜一案。"}],
    fullText: `一、有關長照服務給付項目、內容及價格，皆明定於長期照顧服務申請及給付辦法(以下簡稱給付辦法)附表四照顧組合表，其價格係考量各項長照服務的風險、技術困難度及服務時間等因素，以最普遍發生資源耗用的狀況訂定，包含完整完成服務內容之相關人事及服務單位行政成本，給予服務單位合理的費用。
二、依據給付辦法第16條之規定，長照特約單位於執行照顧組合表之服務內容後，始得向地方主管機關申請費用支付，費用支付之內容以照顧組合表所定者為限。
三、經查照顧組合表BB01至BB14為日間照顧服務，內容載明應包含生活照顧、健康促進、文康休閒活動、家屬指導及諮詢服務及備餐服務，爰凡長照特約單位提供整體長照服務使用者與前開服務內容相關之成本費用(包含人事費、維修費、房屋土地成本、設備費、消耗性材料費、非消耗性材料費及食材費等)，皆已內含於BB01至BB14之支付價格中，不應超額或擅立收費項目向長照服務使用者收費。
四、再查，長照特約單位提供之服務項目，若非屬照顧組合表服務內容，則應依長期照顧服務法(以下簡稱長服法)第35條第2項規定，先報請機構所在地主管機關核定後，始得向長照服務使用者收費。
五、如屬個案特殊需求之耗材，應由長照服務使用者或其家庭照顧者自行購置，或由長照特約單位代買代收(非營利行為)，亦非為長服法第35條第2項之應報請主管機關核定範疇。`
  },

    citations: [{agency:"臺中市政府衛生局",agencyShort:"台中",date:"2022-08-10",sourceUrl:"https://www.health.taichung.gov.tw/media/833814/%E8%A1%9B%E7%94%9F%E7%A6%8F%E5%88%A9%E9%83%A8111%E5%B9%B48%E6%9C%883%E6%97%A5%E8%A1%9B%E9%83%A8%E9%A1%A7%E5%AD%97%E7%AC%AC1110129543%E8%99%9F%E5%87%BD.pdf",docNumber:"長期照顧給付及支付基準「陪同外出(BA13)」照顧組合內容及說明疑義一案。"}],
    fullText: `一、衛生福利部前以109年11月17日衛部顧字第1091962369號函（諒達）示略以，現行長照服務對象照顧計畫之擬定，係由各直轄市、縣（市）政府特約社區整合型服務中心（A）個管人員，衡酌服務可近性及即時性媒合長照服務，於正式與非正式資源不重疊使用之前提，據以多元組合規劃，且該計畫需經各縣市長期照顧管理中心核認，確保社會資源之有效運用後，始得辦理，先予敘明。
二、依長期照顧服務申請及給付辦法之照顧組合「陪同外出」（BA13）組合內容說明，內容為外出工具之安排、陪同外出及注意安全，依其給付目的，係針對長照服務對象因獨自外出，於交通路程途中有安全疑慮，始訂有本項照顧組合，故照顧服務員自行以交通工具載送長照失能者，顯難同時注意駕駛路況及長照失能者安全，爰居家照顧服務員自行以交通工具載送期間，不應有居家服務單位申報「陪同外出」（BA13）照顧組合費用。
三、又依現行公路法、汽車運輸業管理規則及老人福利服務提供者資格要件及服務準則等相關法令規定，提供交通接送服務且收受報酬者，應經核准並取得營業執照，駕駛員亦應持有職業駕照，另為保障受照顧者之交通安全，並應投保汽車強制責任或乘客相關保險，爰倘長照失能者有交通接送服務之需求，應由交通接送服務特約單位或汽車運輸業之從業人員為之。`

    fullText: `一、按長照居家無障礙環境改善服務之申請及給付係依據長期照顧服務申請及給付辦法辦理，次依該辦法第20條第1項規定，輔具及居家無障礙環境改善服務項目、核銷應備文件、保固書及評估報告書格式，準用身心障礙者輔具費用補助辦法相關規定。二、查身心障礙輔具費用補助基準表─住家及其他場所之家具及改裝組件內容略以，其改善部分如須改變硬體結構者應檢附相關證明文件及房屋所有權之證明文件影本（非自有房屋者，須附租賃契約書影本、房屋所有權狀影本及屋主出具之施工同意書），合先敘明。三、上開規定述及需檢附房屋所有權狀影本，旨為居家無障礙環境改善涉及房屋硬體結構改變，需於屋主同意之基礎下進行修繕，以避免相關紛爭。惟貴府詢問申請人本身僅有房屋部分持分，卻需拿出其他家屬所有持分之房屋所有權證明，致民眾無法檢附完整文件而喪失補助機會1節，有關房屋所有權狀影本取得規定，仍應以上開原則辦理，惟實務作業所遇房屋持有狀態多樣，請貴府參照其他縣市（例如：臺北市、桃園市及臺南市等）作法，並秉持維護轄內長照身心失能個案權益，依個案事實予以行政裁量。四、依據建築物無障礙設施設計規範第1章總則之104.2無障礙設施：係指定著於建築物之建築構件（含設備），使建築物、空間為行動不便者可獨立到達、進出及使用。爰貴府函詢之身心障礙輔具費用補助基準表，所稱「改變硬體結構」之定義，如包含在牆面或地面有施作痕跡，即屬「改變硬體結構」，請按上開規範辦理。五、如附件。`
  },

    fullText: `一、依長期照顧服務法第9條長照服務依其提供方式，區分為居家式、社區式、機構住宿式及家庭照顧者支持服務等長照服務，居家照顧服務依提供方式為到宅提供服務，先予敘明。二、依長期照顧服務申請及給付辦法第16條之立法說明，明示長照特約單位申請費用支付之服務內容，以照顧組合表所定內容為限，包含服務提供前之準備、實際服務、善後及記錄，爰執行「家務協助」（BA15）或「代購或代領或代送服務」（BA16）之照顧組合，其服務時段內，服務對象自應在宅接受服務。三、如附件。`

  {

    agency: "衛生福利部",

    date: "2022-02-08",
    year: 2022,
    code: "BA13",
    title: "為協助居家服務個案接種COVID-19疫苗，請貴府配合說明段辦理，並請轄內居家服務機構，請查照",
    summary: "新增一次性臨時服務項目「BA13a陪同施打COVID-19疫苗」，每案僅得申報一次，每次計價新臺幣200元，不列入照顧及專業服務給付總額；臨時加碼服務提供期間為即日起至111年3月31日止。",
    status: "有效",
    sourceUrl: "./source-pdfs/協助居家服務個案接種COVID-19疫苗(BA13a).pdf",
    citations: [{agency:"衛生福利部",agencyShort:"衛福部",date:"2022-02-08",sourceUrl:"./source-pdfs/協助居家服務個案接種COVID-19疫苗(BA13a).pdf",docNumber:"衛生福利部111年2月8日衛部顧字第1111960257號函"}],
    fullText: `主旨：為協助居家服務個案接種COVID-19疫苗，請貴府配合說明段辦理，並請轉知轄內居家服務機構，請查照。

說明：
一、鑒於國內COVID-19疫情升溫，且失能或高齡人口罹病後轉重症之風險較高，為提升居家服務對象之保護力，協助渠等人員接種COVID-19疫苗，本部爰透過新增一次性臨時服務項目「BA13a陪同施打COVID-19疫苗」之方式結合長照服務推動，重點說明如次，並請貴府配合規劃接種疫苗之相關便捷措施，避免居家服務對象久候：
(一)申報條件：照顧服務人員應於完成提供陪同施打COVID-19疫苗服務後登打服務紀錄，不須事前變更照顧計畫，但可同時申報BA13陪同外出服務。
(二)給付金額：每位服務個案僅得申報一次BA13a，每次計價為新臺幣200元；另可依實際陪同外出時數覈實申報BA13，至多以3組為限。因陪同接種疫苗屬臨時加碼服務性質，故該次之BA13及BA13a不列入照顧及專業服務給付總額，民眾亦不需支付自行負擔額度。
(三)臨時加碼服務提供期間：即日起至3月31日止。
(四)服務方式：居服員須於事前提醒服務對象疫苗施打相關流程和注意事項，並於接種後關懷其身體狀況，若有異狀即與家屬聯繫並提供陪同就醫之臨時服務；此外，為提升個案外出接種疫苗之近便性，得搭配DA01交通接送服務使用。
(五)費用申報及撥付：比照現行長照特約服務單位提供與申報長照服務之作業流程，居家服務特約單位自111年4月7日起於本部「照顧服務管理資訊平台」或長照自建資訊系統申報111年2月至3月間之陪同施打疫苗服務費用，再由長照2.0服務費用支付審核系統審核後，循貴府長照給付及支付費用方式，撥付服務費用。
二、至照顧計畫中已有BA14陪同就醫服務者，倘服務個案有陪同就醫及施打疫苗之需求，則按長照服務給付及支付規定申請BA14費用，不另加碼獎助BA13a。此外，考量COVID-19疫苗接種非屬例行性就醫項目，故請貴府督導轄內長期照顧管理中心及社區整合型服務中心（A），不得因服務對象僅有接種COVID-19疫苗需求而於照顧計畫新增BA14一項。
三、本項所需經費皆由長照2.0整合型計畫經費內勻用支應。
四、另請貴府積極媒合醫療院所前往社區式及住宿式長照機構提供疫苗施打之外展服務，亦應於巷弄長照站、社區照顧關懷據點、失智據點就參與共餐或據點活動之長者進行宣導，促請其儘速完成疫苗接種，保護自己也保護他人，併此敘明。

正本：各直轄市及各縣(市)政府
副本：本部會計處、本部長期照顧司`

    id: "MOHW-AUTO-001",
    agency: "衛生福利部",

    date: "2022-01-13",
    year: 2022,
    code: "BA13",
    title: "鑒於國內COVID-19疫情升溫，為防範Omicron變異株對北北基桃地區居家式及社區式長照機構之防疫威脅，請臺北市政府、新北市政府、桃園市政府及基隆市政府調整相關防疫措施，自即日起生效，併請所轄相關機構配合辦理，請查照",
    summary: "暫停110年11月22日衛部顧字第1100147146號函之社區式長照機構防疫管理鬆綁措施，並就居家式服務（含BA13陪同外出服務）之防疫作為提出具體調整要求，南投縣政府等非北北基桃直轄市及縣市為副本收受機關。",
    status: "有效",
    sourceUrl: "./source-pdfs/111年1月13日衛部顧字第1111960072號防疫.pdf",
    citations: [{agency:"衛生福利部",agencyShort:"衛福部",date:"2022-01-13",sourceUrl:"./source-pdfs/111年1月13日衛部顧字第1111960072號防疫.pdf",docNumber:"衛生福利部111年1月13日衛部顧字第1111960072號函"}],
    fullText: `主旨：鑒於國內COVID-19疫情升溫，為防範Omicron變異株對北北基桃地區居家式及社區式長照機構之防疫威脅，請臺北市政府、新北市政府、桃園市政府及基隆市政府調整相關防疫措施，自即日起生效，併請轉知所轄相關機構配合辦理，請查照。

說明：
一、因應嚴重特殊傳染性肺炎（COVID-19）疫情發展，請貴府積極督導轄內社區式長照機構落實「衛生福利機構（社區型）因應COVID-19防疫管理指引」及「社區式長期照顧機構（家庭托顧）因應防疫作為建議注意事項」，暫停本部110年11月22日衛部顧字第1100147146號函（諒達）之社區式長照機構防疫管理鬆綁措施，並自即日起調整如下：
(一)限制服務對象至機構外從事社區適應活動。
(二)提供社區式服務之衛生福利機構皆應進行分艙分流之照顧機制。
(三)用餐環境及交通接送車輛座位安排，如現行貴府係參考「餐飲業防疫指引」及「遊覽車客運業防疫管理措施」辦理，請視疫情發展情形適時評估升高防疫措施。
(四)機構內環境清潔及消毒除應定期執行外，亦應提高每日進行之頻率為宜。
(五)原則限制訪客進入機構為宜；但因陪同照顧、執行公務或實習而確有進入機構必要者，應比照工作人員，即完整接種COVID-19疫苗且滿14日，並於首次進入前自費提供3日內抗原快篩或PCR檢驗之陰性證明等。
二、居家服務部分，為降低相關人員因服務提供而造成疾病傳播之風險，請貴府按本部110年6月10日衛部顧字第1101961572號函（如附件），督導所轄居家式服務機構加強防疫作為；有執行BA13陪同外出服務者，應避免陪同個案出入會接觸不特定對象且人流較多之場所，服務全程皆應配戴口罩、勤做手部消毒工作，並請貴府視疫情發展適時評估暫停提供BA13陪同外出服務。
三、為嚴守社區防線，請貴府積極宣導並協助居家式及社區式服務機構、巷弄長照站及失智據點等社區型據點之工作人員及服務對象完整接種2劑基礎劑或追加劑之COVID-19疫苗，特別是目前接種率較低之居家服務及家庭托顧服務對象，必要時得媒合醫療院所提供疫苗施打之外展服務，以預防相關人員發生重症情形。
四、另貴府如有特殊考量，在未達第三級以上疫情警戒標準或機構（據點）內未發生確定病例，而有布達暫停服務之決定，則應於布達前盤點需求、規劃相關服務配套措施，協助民眾服務轉介，並應整備及調派相關支援人力，以滿足民眾疫情期間之照顧需求，併此敘明。
五、副本抄送北北基桃以外之直轄市及縣（市）政府，請視疫情發展狀況依職權評估，適時依前開規定提高轄內機構防疫措施，並請積極宣導與協助機構及據點之工作人員及服務對象接種2劑基礎劑或追加劑之COVID-19疫苗，以提升轄內長照服務單位疫苗接種率。

正本：臺北市政府、新北市政府、桃園市政府、基隆市政府
副本：各直轄市及各縣(市)政府(基隆市政府、新北市政府、臺北市政府、桃園市政府除外)、衛生福利部疾病管制署、衛生福利部社會及家庭署、本部護理及健康照護司、本部心理及口腔健康司、本部長期照顧司(均含附件)`

<!-- ══════════ 邏輯層 ══════════ -->
<script>
(function(){
  const codeGroupLabels = {
    AA: "AA碼（照顧管理）",
    S:  "短照（短期替代照顧）",
    G:  "G碼（喘息服務）",
    B:  "B碼（照顧服務）",
    C:  "C碼（專業服務）",
    DA: "DA碼（交通接送）",
    EI: "EI碼（智慧輔具）",
    EF: "EF碼（輔具服務）",
    EH: "EH碼（居家無障礙環境改善）",
    OTHER: "其他／未分類"
  };
  const codeGroupOrder = ["AA","S","G","B","C","DA","EI","EF","EH","OTHER"];

  // 依函釋的 code 欄位及主旨關鍵字綜合判斷所屬碼別大類
  // 注意順序：越具體／越容易誤判的規則要排在前面優先比對
  function codeGroupOf(record){
    const code = (record && record.code) || "";
    const text = ((record && record.title) || "") + ((record && record.docNumber) || "") + ((record && record.summary) || "");

    if (code.startsWith("AA")) return "AA";                                   // 照顧管理類，如 AA01、AA02、AA08…
    if (/喘息/.test(text) || code.startsWith("G")) return "G";                // 喘息服務，涵蓋 GA、G碼字樣（優先於短照判斷）
    if (/短照|短期替代照顧|短期照顧服務/.test(text) || code.startsWith("S")) return "S";  // 短期替代照顧服務
    if (code.startsWith("B")) return "B";                                     // 照顧服務，涵蓋 BA、BB、BD…
    if (code.startsWith("C")) return "C";                                     // 專業服務
    if (code.startsWith("DA")) return "DA";                                   // 交通接送
    if (/智慧輔具/.test(text)) return "EI";                                    // 智慧輔具（新列計）
    if (/環境改善|居家無障礙/.test(text) || /^F/.test(code)) return "EH";       // 居家無障礙環境改善（新列計，含舊制F碼）
    if (/輔具/.test(text) || /^E/.test(code)) return "EF";                    // 一般輔具服務
    return "OTHER";
  }

  let activeCodeGroups = new Set();
  let currentTab = 'search';

  // ── 初始化：年份下拉、碼別篩選鈕、資料筆數 ──
  function init(){
    const years = [...new Set(REAL_DATA_SOURCE.map(d => d.year))].sort((a,b)=>b-a);
    const yearSelect = document.getElementById('yearSelect');
    years.forEach(y=>{
      const opt = document.createElement('option');
      opt.value = y; opt.textContent = y + ' 年';
      yearSelect.appendChild(opt);
    });

    const codeFilters = document.getElementById('codeFilters');
    codeGroupOrder.forEach(group=>{
      const wrap = document.createElement('div');
      wrap.innerHTML = `
        <input type="checkbox" id="code-${group}" class="filter-check hidden" value="${group}">
        <label for="code-${group}" class="cursor-pointer inline-block px-3 py-1.5 border border-[var(--line-strong)] rounded-sm hover:border-[var(--gov-blue)] select-none">${codeGroupLabels[group]}</label>
      `;
      codeFilters.appendChild(wrap);
    });
    document.querySelectorAll('.filter-check').forEach(cb=>{
      cb.addEventListener('change', ()=>{
        cb.checked ? activeCodeGroups.add(cb.value) : activeCodeGroups.delete(cb.value);
        render();
      });
    });

    const meta = document.getElementById('dataMeta');
    const latest = REAL_DATA_SOURCE.map(d=>d.date).sort().reverse()[0];
    meta.textContent = `共收錄 ${REAL_DATA_SOURCE.length} 筆函釋 ／ 最新更新 ${latest}`;

    document.getElementById('searchBtn').addEventListener('click', render);
    document.getElementById('keywordInput').addEventListener('keydown', e=>{ if(e.key==='Enter') render(); });
    document.getElementById('yearSelect').addEventListener('change', render);
    document.getElementById('clearFilters').addEventListener('click', ()=>{
      document.getElementById('keywordInput').value='';
      document.getElementById('yearSelect').value='';
      activeCodeGroups.clear();
      document.querySelectorAll('.filter-check').forEach(cb=>cb.checked=false);
      render();
    });

    document.querySelectorAll('.tab-btn').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
        btn.classList.add('active');
        currentTab = btn.dataset.tab;
        document.getElementById('tab-search').classList.toggle('hidden', currentTab!=='search');
        document.getElementById('tab-dashboard').classList.toggle('hidden', currentTab!=='dashboard');
        if(currentTab==='dashboard') renderCharts();
      });
    });

    document.getElementById('detailModal').addEventListener('click', e=>{
      if(e.target.id === 'detailModal') window.__closeDetail();
    });
    document.addEventListener('keydown', e=>{
      if(e.key === 'Escape') window.__closeDetail();
    });

    render();
  }

  // ── 篩選邏輯 ──
  function getFiltered(){
    const kw = document.getElementById('keywordInput').value.trim().toLowerCase();
    const year = document.getElementById('yearSelect').value;
    return REAL_DATA_SOURCE.filter(d=>{
      if(year && String(d.year) !== year) return false;
      if(activeCodeGroups.size && !activeCodeGroups.has(codeGroupOf(d))) return false;
      if(kw){
        const haystack = (d.title + d.summary + d.agency + d.docNumber).toLowerCase();
        if(!haystack.includes(kw)) return false;
      }
      return true;
    }).sort((a,b)=> b.date.localeCompare(a.date));
  }

  // ── 渲染卡片 ──
  function render(){
    const results = getFiltered();
    const list = document.getElementById('resultsList');
    const empty = document.getElementById('emptyState');
    document.getElementById('resultCount').textContent = `符合條件：${results.length} 筆`;

    if(results.length === 0){
      list.innerHTML = '';
      empty.classList.remove('hidden');
      return;
    }
    empty.classList.add('hidden');

    list.innerHTML = results.map(d => {
      const isCross = d.citations && d.citations.length > 1;
      const otherAgencies = isCross ? [...new Set(d.citations.filter(c=>c.agencyShort!==d.agencyShort).map(c=>c.agencyShort))] : [];
      return `
      <article class="doc-card status-${d.status} rounded-sm p-4 flex gap-4 cursor-pointer" onclick="window.__openDetail('${d.id}')">
        <div class="seal" style="${d.agencyShort.length>2 ? 'width:64px;height:64px;font-size:14px;' : ''}">${d.agencyShort}</div>
        <div class="flex-1 min-w-0">
          <div class="flex flex-wrap items-center gap-2 mb-1.5">
            <span class="code-chip px-2 py-0.5 rounded-sm">${d.code}</span>
            <span class="status-chip status-${d.status} rounded-sm">${d.status}</span>
            ${isCross ? `<span class="status-chip rounded-sm" style="background:var(--gov-blue);color:#fff;">跨機關函釋 · 同見於${otherAgencies.join('、')}</span>` : ''}
            <span class="text-xs text-[var(--ink-soft)] font-mono">${d.docNumber}</span>
          </div>
          <h3 class="font-display font-bold text-base leading-snug mb-1">${d.title}</h3>
          ${d.summary && d.summary !== d.title ? `<p class="text-sm text-[var(--ink-soft)] leading-relaxed mb-2">${d.summary}</p>` : ''}
          <div class="flex items-center gap-3 text-xs text-[var(--ink-soft)]">
            <span>${d.agency}</span>
            <span class="font-mono">${d.date}</span>
            <span class="text-[var(--gov-blue)] hover:underline ml-auto">查看全文與比對 →</span>
          </div>
        </div>
      </article>
    `; }).join('');
  }

  // ── 詳情 / 全文 / 跨機關比對 Modal ──
  window.__openDetail = function(id){
    const d = REAL_DATA_SOURCE.find(x=>x.id===id);
    if(!d) return;
    const citations = d.citations || [];
    const supersedeNote = d.supersededBy
      ? `<div class="text-sm bg-[var(--seal-red-dim)] text-[var(--seal-red)] border border-[var(--seal-red)] rounded-sm p-2 mb-3">本函已停止適用，請參見：${d.supersededBy}</div>`
      : '';
    const otherVersions = citations.length > 1
      ? `<div class="mt-4 pt-3 border-t border-[var(--line)]">
           <p class="text-xs font-bold text-[var(--ink-soft)] mb-2">各機關轉知此份央文之版本：</p>
           <div class="flex flex-col gap-2">
             ${citations.map(c => `
               <div class="flex items-center gap-2 text-xs">
                 <span class="px-2 py-0.5 rounded-sm border border-[var(--line-strong)] font-bold">${c.agencyShort}</span>
                 <span class="text-[var(--ink-soft)] font-mono">${c.date}</span>
                 <a href="${c.sourceUrl}" target="_blank" class="text-[var(--gov-blue)] hover:underline ml-auto">開啟該機關原文 →</a>
               </div>
             `).join('')}
           </div>
         </div>`
      : '';
    // summary 與 title（主旨）相同時不重複顯示內文段落，僅保留全文尚未收錄的提示
    const bodyHtml = d.fullText
      ? `<div class="whitespace-pre-line text-sm leading-relaxed">${d.fullText}</div>`
      : `${d.summary && d.summary !== d.title ? `<p class="text-sm text-[var(--ink-soft)] leading-relaxed">${d.summary}</p>` : ''}
         <p class="text-xs text-[var(--ink-soft)] mt-2">本站尚未收錄逐字全文，下方已嵌入原始公文/PDF，或點擊另開新視窗查看。</p>`;

    document.getElementById('modalBody').innerHTML = `
      <div class="flex items-start gap-3 mb-3">
        <div class="seal" style="${d.agencyShort.length>2 ? 'width:64px;height:64px;font-size:14px;' : ''}">${d.agencyShort}</div>
        <div>
          <div class="flex flex-wrap gap-2 mb-1">
            <span class="code-chip px-2 py-0.5 rounded-sm">${d.code}</span>
            <span class="status-chip status-${d.status} rounded-sm">${d.status}</span>
          </div>
          <h2 class="font-display font-bold text-lg leading-snug">${d.title}</h2>
          <p class="text-xs text-[var(--ink-soft)] font-mono mt-1">${d.docNumber}</p>
        </div>
      </div>
      ${supersedeNote}
      ${bodyHtml}
      ${otherVersions}
      <div class="mt-4 pt-3 border-t border-[var(--line)]">
        <a href="${d.sourceUrl}" target="_blank" class="text-sm text-[var(--gov-blue)] hover:underline">↗ 在新分頁開啟原始公文 / PDF</a>
      </div>
      <div class="mt-3 border border-[var(--line)] rounded-sm overflow-hidden" style="height:50vh;">
        <iframe src="${d.sourceUrl}" class="w-full h-full" title="原文預覽"></iframe>
      </div>
    `;
    document.getElementById('detailModal').classList.remove('hidden');
  };
  window.__closeDetail = function(){
    document.getElementById('detailModal').classList.add('hidden');
  };

  // ── Dashboard 圖表 ──
  let chartsInitialized = false;
  function renderCharts(){
    if(chartsInitialized) return;
    chartsInitialized = true;

    const byCode = {};
    const byAgency = {};
    const byYear = {};
    REAL_DATA_SOURCE.forEach(d=>{
      byCode[d.code] = (byCode[d.code]||0)+1;
      byAgency[d.agencyShort] = (byAgency[d.agencyShort]||0)+1;
      byYear[d.year] = (byYear[d.year]||0)+1;
    });

    const palette = ['#2C5F8A','#B3261E','#4B5266','#8FA8BE','#D9A79C','#1C2333'];

    new Chart(document.getElementById('chartByCode'), {
      type: 'doughnut',
      data: {
        labels: Object.keys(byCode),
        datasets: [{ data: Object.values(byCode), backgroundColor: palette }]
      },
      options: { plugins: { legend: { position: 'bottom', labels:{font:{family:"'Noto Sans TC'"}} } } }
    });

    new Chart(document.getElementById('chartByAgency'), {
      type: 'bar',
      data: {
        labels: Object.keys(byAgency),
        datasets: [{ data: Object.values(byAgency), backgroundColor: '#2C5F8A' }]
      },
      options: {
        plugins: { legend: { display:false } },
        scales: { y: { beginAtZero:true, ticks:{ precision:0 } } }
      }
    });

    const years = Object.keys(byYear).sort();
    new Chart(document.getElementById('chartByYear'), {
      type: 'line',
      data: {
        labels: years,
        datasets: [{
          data: years.map(y=>byYear[y]),
          borderColor: '#B3261E',
          backgroundColor: 'rgba(179,38,30,0.08)',
          fill: true,
          tension: .3
        }]
      },
      options: {
        plugins: { legend: { display:false } },
        scales: { y: { beginAtZero:true, ticks:{ precision:0 } } }
      }
    });
  }

  init();
})();
</script>
