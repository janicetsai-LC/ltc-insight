name: 自動更新長照函釋資料

# 每週一早上 8:00（台灣時間）自動執行一次；也可以到 GitHub 的 Actions 分頁手動觸發
on:
  schedule:
    - cron: "0 0 * * 1"  # UTC 0:00 週一 = 台灣時間 週一 08:00
  workflow_dispatch: {}   # 允許手動點擊「Run workflow」立即執行

permissions:
  contents: write  # 需要寫入權限才能 commit 更新後的 index.html

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: 簽出 repository
        uses: actions/checkout@v4

      - name: 設定 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 安裝依賴套件
        working-directory: scraper
        run: npm install

      - name: 執行自動更新
        working-directory: scraper
        run: node update-all.mjs

      - name: 檢查是否有資料異動
        id: check_diff
        run: |
          if git diff --quiet index.html; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 提交更新
        if: steps.check_diff.outputs.changed == 'true'
        run: |
          git config user.name "ltc-insight-bot"
          git config user.email "actions@github.com"
          git add index.html
          git commit -m "自動更新：$(date '+%Y-%m-%d') 函釋資料同步"
          git push
